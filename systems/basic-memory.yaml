# Basic Memory, as counterparts.ai/directory/basic-memory/ shows it.

# Drafted from intake issue "Add Basic Memory" (a maintainer's test of the
# intake), against release v0.24.1 of basicmachines-co/basic-memory: its code,
# README, Claude Code plugin and skills, and the docs home page. Graded from the
# code. Cleanup, reflection and merging exist only as skills (instructions an
# agent follows when asked or on a schedule you set), so they are graded as
# something you switch on. The Claude Code plugin is a separate install on top
# of the MCP server; its grades name it.

slug: basic-memory
name: Basic Memory
tagline: >-
  A knowledge base of plain Markdown files that you and your AI both read and write, with search and links between notes.
category: work
alsoIn:
  - user
maker: Basic Machines (basicmachines-co)
links:
  website: https://basicmemory.com
  repos:
    - basicmachines-co/basic-memory
  packages:
    - registry: pypi
      name: basic-memory
    - registry: npm
      name: "@basicmemory/openclaw-basic-memory"
openness: open

summary: >-
  Basic Memory runs as an MCP server next to your AI. When you ask, or when its instructions say so, the AI writes a note: a Markdown file with facts in categories and links to other notes. The files sit in a folder on your disk, and you can edit them yourself, for example in Obsidian. A local index makes them searchable by keywords and by meaning. In a later chat, the AI searches the notes, opens the ones it needs, and can follow their links to related notes. An optional Claude Code plugin adds a short briefing at the start of each session and saves a checkpoint note before the chat is compacted. A paid cloud version hosts the same files and syncs them across devices.
forWho: >-
  People who use Claude, Codex, Cursor, ChatGPT or another MCP client and want a lasting knowledge base they can read and edit themselves. Developers can add the Claude Code or Codex plugin for session briefings and checkpoints.
remembers: >-
  Whatever the AI or you write down: notes on topics, people and projects, decisions, tasks, session checkpoints, and imported Claude or ChatGPT chats.
doesnt:
  - >-
    The core doesn't decide on its own what to save. The AI has to call a write tool, or you ask it to. Only the Claude Code plugin saves something by itself: a checkpoint before compaction, once a project is set up.
  - >-
    Nothing fades, gets stronger with use, or is merged on its own. Cleaning up, merging and drawing lessons are skills an agent runs when asked or on a schedule you set.
  - >-
    An edit rewrites the note's file. The local version keeps no earlier copies; the paid cloud version adds snapshots.
  - >-
    The CLI sends anonymous events (cloud promo views, cloud login attempts) to the maker's analytics by default, and it updates itself silently once a day for uv tool and Homebrew installs. BASIC_MEMORY_NO_PROMOS=1 turns off the events, and a config setting turns off the updates.
  - >-
    It's under AGPL-3.0. If you change it and offer it to others as a network service, you have to share your changes.
standout:
  - >-
    The memory is plain Markdown in a folder you own. You and the AI read and edit the same files, and they open in any editor or in Obsidian.
  - >-
    Notes hold facts in categories and typed links to other notes, so the AI can walk from one note to its neighbours.
  - >-
    A fact can carry the dates when it held, and search can ask what was true during a given window.
  - >-
    The Claude Code plugin briefs Claude at the start of each session with active tasks, open decisions and recent checkpoints, and saves a checkpoint before compaction with no extra AI call.

facts:
  lives: Your machine (paid cloud optional)
  local: true
  keys: None locally; a subscription for the cloud version
  worksWith:
    - Claude Desktop
    - Claude Code
    - Codex
    - Cursor
    - VS Code
    - ChatGPT
    - Obsidian
    - Any MCP client
  license: AGPL-3.0
  price: Free locally; cloud $15/mo during beta (regular price $19), 7-day free trial
  tags:
    runs:
      - local
      - cloud
    needs:
      - none
      - account
    works:
      - Claude Code
      - Claude Desktop
      - Codex
      - Cursor
      - ChatGPT
      - Obsidian
      - MCP

hood:
  writes: >-
    The AI you talk to, through MCP tools that write and edit notes, when you ask or its instructions say so. You can edit the files too. The Claude Code plugin also writes a checkpoint before compaction, taken from the transcript without an AI call.
  stores: >-
    Markdown files in a folder on your disk (~/basic-memory by default), indexed in a local SQLite database with full-text and vector search. Postgres is an option; the cloud version hosts them for you.
  finds: >-
    Search by keywords and meaning together, with filters by note type, status, tags and dates. A context tool opens a note with the notes it links to, up to several links away. A recent-activity tool lists what changed lately.
  cost: >-
    None from Basic Memory itself. Embeddings are made locally with FastEmbed. An optional reranker or hosted embeddings use a provider and key you choose.

mechanisms:
  salience:
    status: partial
    depth: 1
    note: >-
      The Claude Code plugin's opt-in output style tells Claude to save real decisions and skip routine chatter. Otherwise the AI saves whatever it or you choose. There's no importance score.
    source: https://github.com/basicmachines-co/basic-memory/blob/v0.24.1/plugins/claude-code/output-styles/basic-memory.md

  emotional:
    status: none
    note: No emotional weighting. Nothing in the code reads or records feeling.

  decay:
    status: partial
    depth: 1
    note: >-
      Nothing fades note by note. The Claude Code plugin's session-start brief only recalls session checkpoints from the last 3 days by default, so older ones drop out of it.
    source: https://github.com/basicmachines-co/basic-memory/blob/v0.24.1/src/basic_memory/cli/commands/hook.py

  interference:
    status: partial
    depth: 1
    note: >-
      A defrag skill, run when asked or on your schedule, has the agent look for duplicate notes and contradictions and date or merge them. Nothing checks a new note against old ones as it's written.
    source: https://github.com/basicmachines-co/basic-memory/blob/v0.24.1/skills/memory-defrag/SKILL.md

  retrieval:
    status: none
    note: >-
      Being found doesn't strengthen a note. The code keeps no use count and gives no boost for being recalled.

  association:
    status: built
    depth: 3
    note: >-
      Notes link to each other with typed wiki-style links. The context tool brings back a note with its linked notes, several links out, nearest first. The links carry no weights, and plain search doesn't follow them.
    source: https://github.com/basicmachines-co/basic-memory/blob/v0.24.1/src/basic_memory/services/context_service.py

  prospective:
    status: partial
    depth: 1
    note: >-
      The Claude Code plugin, a separate install, adds active tasks, open decisions and recent checkpoints at the start of each session. Nothing comes back at a set time or when a situation arises.
    source: https://github.com/basicmachines-co/basic-memory/blob/v0.24.1/src/basic_memory/cli/commands/hook.py

  consolidation:
    status: partial
    depth: 1
    note: >-
      A reflect skill folds recent notes into the notes they belong in, and a defrag skill splits, merges and retires notes. Each runs only when an agent is asked or scheduled to run it.
    source: https://github.com/basicmachines-co/basic-memory/blob/v0.24.1/skills/memory-reflect/SKILL.md

  reconsolidation:
    status: partial
    depth: 1
    note: >-
      A fact can be dated with when it held, and search can ask what was true in a window. Correcting is left to the AI or you, and an edit keeps no earlier copy of the note locally.
    source: https://github.com/basicmachines-co/basic-memory/blob/v0.24.1/src/basic_memory/markdown/temporal_qualifier.py

  episodic-semantic:
    status: partial
    depth: 1
    note: >-
      The reflect skill has the agent turn recent notes into lasting decisions, lessons and preferences, but only when it's asked or scheduled to run.
    source: https://github.com/basicmachines-co/basic-memory/blob/v0.24.1/skills/memory-reflect/SKILL.md

  schema:
    status: partial
    depth: 1
    note: >-
      Each note is a page about one thing (a person, a project, a topic) that the AI or you add facts to. Nothing builds a profile on its own or weighs new facts against it.
    source: https://github.com/basicmachines-co/basic-memory/blob/v0.24.1/README.md

flow:
  steps:
    - label: You chat
      detail: You work with Claude, Codex, Cursor or another MCP client.
    - label: AI writes a note
      detail: When asked, it saves a Markdown note with facts and links.
    - label: Files and index
      detail: Notes stay as files on your disk, indexed for keyword and meaning search.
    - label: Search and follow links
      detail: Next time, the AI searches, opens notes and follows their links.
  loop:
    to: 0
    label: next chat

