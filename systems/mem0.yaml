# Mem0, as counterparts.ai/directory/mem0/ shows it.

# Researched 2026-09-25 against Mem0's current docs (v3); Dream re-checked
# 2026-10-20. Mem0 changed a lot in 2026: since 14 Apr 2026 writes are
# ADD-only and the graph store became built-in entity linking, so older
# write-ups (and the 2025 paper's ADD/UPDATE/DELETE/NOOP step) are out of
# date. Several mechanisms exist only on the cloud Platform, not in the
# open-source library. Of Dream's three parts, Supersede and Merge run as
# memories are added, and the Dream docs list them on every cloud plan
# including the free one; only Synthesis (pattern memories) is a scheduled
# background pass, opt-in per project on Pro ($249/mo) and up, for memories
# created after it's switched on and users with at least 20 memories. The
# pricing page lists "Dream (Memory Consolidation)" under Pro and Enterprise
# only, with a dash for Hobby and Starter; the entry says both.

slug: mem0
name: Mem0
tagline: >-
  A plug-in memory layer that pulls facts out of AI chats and hands back the relevant ones later.
category: blocks
alsoIn:
  - user
  - work
maker: Mem0
links:
  website: https://mem0.ai
  repos:
    - mem0ai/mem0
  packages:
    - registry: pypi
      name: mem0ai
    - registry: npm
      name: mem0ai
# the library is Apache-2.0; decay, Dream and the rest are cloud-only (free tier included)
openness: partly

summary: >-
  When you chat with an AI, Mem0 has another AI read the conversation and jot down short facts,
  like “prefers TypeScript” or “moved to SF”. It files them by who they belong to, notes the
  names they mention, and later finds the right ones by meaning, keywords and those names. On
  its cloud, “Dream” merges duplicates and marks outdated facts as replaced as they're added,
  and, if you switch it on (Pro plan), a background pass writes up patterns.
forWho: >-
  Mainly developers adding memory to their own apps, from solo builders to enterprise. People
  also meet it through its plugins for Claude Code, Cursor and other editors, and a Chrome
  extension.
remembers: >-
  Short facts about users, agents and sessions (preferences, details, project facts), plus the
  names they mention.
doesnt:
  - >-
    Its richer mechanisms (fading, strengthening, Dream) are on the cloud, not in the open-source
    library. Mem0's Dream docs list its merging and replacing on every plan; its pricing page
    lists Dream under Pro and up. The pattern-writing part is opt-in on Pro. Self-hosted,
    contradictory facts pile up side by side.
  - >-
    Its Claude Code plugin sends your session text to Mem0's cloud (with secrets removed), so it
    isn't local-only.
  - No reminders that come back on their own, and no emotional weighting.
  - It's memory about users and projects, not the AI's own sense of self.
standout:
  - >-
    A drop-in memory for almost any stack: about 20 AI model providers, 25 databases, and
    plugins for many agents and editors.
  - >-
    Dream: duplicates are merged and outdated facts marked as replaced as memories arrive, and an
    opt-in background pass finds patterns, with every change recorded and nothing deleted.
  - >-
    Publishes results it ran itself on long-conversation memory benchmarks.

facts:
  lives: Mem0's cloud, or your own server
  local: true
  keys: A Mem0 key (cloud) or an AI model key (self-hosted)
  worksWith:
    - Python & TypeScript SDKs
    - Claude Code
    - Cursor
    - Codex
    - LangGraph
    - CrewAI
  license: Apache-2.0
  price: Free tier; from $19/mo
  tags:
    runs:
      - server
      - cloud
    needs:
      - model-key
      - their-key
    works:
      - Python
      - TypeScript
      - Claude Code
      - Cursor
      - Codex
      - LangGraph
      - CrewAI

hood:
  writes: >-
    A separate AI call reads each conversation and pulls out short facts. The AI you talk to
    doesn't write them.
  stores: >-
    A vector database (about 25 to choose from; Postgres with pgvector self-hosted), plus the
    names each fact mentions.
  finds: By meaning, by keywords, and by shared names, combined into one ranked list.
  cost: >-
    Yes: an AI call to pull out facts on every add, plus embeddings. On the cloud, Dream's
    pattern pass adds more.

mechanisms:
  salience:
    status: partial
    depth: 2
    note: >-
      An AI decides what counts as a fact, and you can say what to include or skip. There's no
      importance score.
    source: https://docs.mem0.ai/platform/features/custom-instructions

  emotional:
    status: none
    note: No emotional weighting in the current version.

  decay:
    status: built
    depth: 3
    only: cloud, opt-in
    note: >-
      Once it's switched on for a project, unused memories slowly sink in search results, though
      nothing is deleted. You can also set expiry dates.
    source: https://mem0.ai/blog/introducing-memory-decay-in-mem0

  interference:
    status: built
    depth: 3
    only: cloud only
    note: >-
      As a memory is added, Dream marks an older fact as replaced when the newer one contradicts
      it. Self-hosted, both are kept.
    source: https://docs.mem0.ai/platform/features/dream

  retrieval:
    status: built
    depth: 3
    only: cloud, opt-in
    note: >-
      Each time a memory comes up in a search, it gets a small boost, once decay is switched on
      for the project.
    source: https://github.com/mem0ai/mem0/blob/main/docs/platform/features/memory-decay.mdx

  association:
    status: built
    depth: 3
    note: >-
      Memories that mention the same person or thing are linked, and naming it in a question
      brings them up.
    source: https://docs.mem0.ai/platform/features/graph-memory

  prospective:
    status: none
    note: It understands “upcoming” when you ask, but nothing comes back on its own.
    source: https://docs.mem0.ai/changelog/highlights

  consolidation:
    status: built
    depth: 3
    only: cloud; the background pass is Pro, opt-in
    note: >-
      Duplicates are merged as memories are added, and, if you switch it on (Pro plan), a weekly
      background pass distills recurring patterns.
    source: https://docs.mem0.ai/platform/features/dream

  reconsolidation:
    status: built
    depth: 3
    only: cloud only
    note: >-
      A replaced memory stays visible, labelled as replaced and linked to what replaced it, and
      you can ask for only the current ones.
    source: https://docs.mem0.ai/platform/features/dream

  episodic-semantic:
    status: built
    depth: 3
    only: cloud Pro, opt-in
    note: >-
      Once you switch it on, Dream writes “pattern memories” from things that keep coming up in
      newer memories, kept alongside the originals.
    source: https://docs.mem0.ai/platform/features/dream

  schema:
    status: partial
    depth: 2
    note: >-
      User profiles (beta) keep a summary of each person, but new facts aren't weighed against
      it.
    source: https://github.com/mem0ai/mem0/blob/main/docs/platform/features/user-profiles.mdx

flow:
  steps:
    - label: A conversation
      detail: Your app or plugin sends Mem0 the chat.
    - label: Pull out facts
      detail: An AI reads it and writes each fact as a new, short memory.
    - label: File them
      detail: Stored by meaning, with the names they mention linked.
    - label: Dream
      detail: "On the cloud: merge repeats and mark old facts replaced; opt-in on Pro, find patterns."
    - label: Hand them back
      detail: Next time, the relevant facts are found and given to the AI.
  loop:
    to: 0
    label: next conversation

checked: 2026-10-20
