# Counterparts, as counterparts.ai/directory/counterparts/ shows it.

# Rated by the same rubric as everyone else, gaps included. Graded against
# counterparts@0.3.37, the version on npm on 2026-10-26 (tag v0.3.37, 547b682).
# First graded 2026-09-25 against 0.3.1; regraded 2026-10-02 against 0.3.11 and
# 2026-10-20 against 0.3.28. Retrieval dropped from in depth to built on 23 Oct:
# a 0.3.27 experiment credits memories shown but not used (a tenth when left
# unrated), which loosens "only real use counts", and it was kept at its check.
# What changed since 0.3.28: 0.3.31 (22 Oct) tags, and beliefs that start weak
# and grow only as memories back them; 0.3.32 (22 Oct) beliefs shown when a
# message names their subject; 0.3.33 (23 Oct) cards that shared a name merged;
# 0.3.36 (25 Oct) the core decided every night, and two experiments: a newer
# state shown ahead of the older in recall, and a word that brought back a used
# memory wired to it. Association moves back to built: on the maker's own store,
# links brought 16 memories to mind from 20 to 26 Oct (14 as pointers, 2 lifted
# into what was shown; none before 20 Oct). Recall walks the links two steps,
# but nothing yet shows the second step doing anything, so not in depth. Schema
# moves to partly built (2): on the same store the night has formed 3 beliefs,
# about Mike and about itself, each backed by memories, none about a project,
# and no new fact has yet been weighed against one. Reconsolidation holds at
# built, not in depth: only core memories need more evidence to change, and no
# belief has yet changed by weight of evidence. Default-on experiments and
# default-off parts raise no grade. Mechanism sources are pinned to the 0.3.37
# release commit (547b682).

slug: counterparts
name: Counterparts
tagline: Gives Claude its own memories, which fade and strengthen the way yours do.
category: self
maker: Mike LaPeter
links:
  website: https://counterparts.ai
  repos:
    - mlapeter/counterparts
  packages:
    - registry: npm
      name: counterparts
openness: open

summary: >-
  At the end of each session, Claude writes down what it learned, in its own words. Those
  memories fade unless they come up again, get stronger when they're used, and the ones that
  keep proving true become part of who it is. Once a day it dreams and then reflects, tidying
  what it holds. Each new session opens with a short note it wrote itself: who it has been, who
  you are, where you left off.
forWho: >-
  People who use Claude Code and want their AI to have its own sense of self and a relationship
  with them that builds over time. You don't have to be a developer.
remembers: >-
  What the AI learned about you, your work together, and itself, written by the AI as notes, not
  transcripts.
doesnt:
  - "It isn't a work memory: it doesn't track tasks, code conventions or project docs."
  - It only works with Claude Code, on a Mac or Linux.
  - It's for one person and one AI, not a team.
standout:
  - The AI writes and owns the memories, not the app and not the user.
  - "Forgetting on purpose: memories fade over the days you actually work together."
  - "A self: memories that hold up across separate days become who it is."
  - Dreams are kept apart from real memories, and a whole dream can be undone.

facts:
  lives: Your machine, one file
  local: true
  keys: None
  worksWith:
    - Claude Code
  license: MIT
  price: Free
  tags:
    runs:
      - local
    needs:
      - none
    works:
      - Claude Code

hood:
  writes: >-
    Claude itself, in its own words, with an importance score: in the moment, and at the end of
    each session. A session left unwritten is written up by the daily background run.
  stores: One SQLite database file on your machine. Exportable as readable text.
  finds: >-
    Your words are matched by keywords and by meaning (a small model that runs on your machine),
    then weighed by how strong each memory is.
  cost: >-
    No API key of its own. Writing happens in your Claude Code sessions; the daily dream,
    reflection and write-up run as short background Claude Code sessions, on your subscription,
    or on your API key if ANTHROPIC_API_KEY is set. Recall and sleep run locally.

mechanisms:
  salience:
    status: built
    depth: 4
    note: >-
      Every memory gets an importance score as it's written: Claude's judgement, how new it is
      beside what's kept (computed), and a default by what it's about when Claude gives none.
    source: >-
      https://github.com/mlapeter/counterparts/blob/547b6826e381a52b96a429898387696dabc6aa4e/src/core/encode/salience.ts

  emotional:
    status: built
    depth: 4
    note: >-
      Feeling holds a memory higher and slows its fading a lot, and a strongly felt one about
      Claude or the two of you can become core sooner once it comes back days later. Feelings
      are recorded, never guessed; mood-matched recall is off.
    source: >-
      https://github.com/mlapeter/counterparts/blob/547b6826e381a52b96a429898387696dabc6aa4e/src/core/physics/index.ts

  decay:
    status: built
    depth: 4
    note: >-
      Each memory outside the core fades on its own curve over the days you use it, slower the
      more it mattered, was felt or used. Once nearly gone, it is filed away after 14 more days
      of use, not deleted.
    source: >-
      https://github.com/mlapeter/counterparts/blob/547b6826e381a52b96a429898387696dabc6aa4e/src/core/sleep/decay.ts

  interference:
    status: partial
    depth: 2
    note: >-
      A new memory that reads as the newer state of a recent one marks the older "may be out of
      date"; Claude or a later dream confirms or rejects it, and as an experiment only a
      confirmation fades the older. As an experiment since 25 Oct, when both come up the newer
      is shown first and the older labelled; other similar memories don't compete in recall.
    dev:
      to: built
      note: >-
        Coming: the newer of two matching memories winning in recall, an experiment until it is
        checked after about a week of use.
    source: >-
      https://github.com/mlapeter/counterparts/blob/547b6826e381a52b96a429898387696dabc6aa4e/src/core/reconsolidation.ts

  retrieval:
    status: built
    depth: 3
    note: >-
      A used memory gets stronger, and each return on a later day makes it harder to lose, more
      the longer the gap. Claude's ratings of what it was shown count as use, and an unrated
      showing counts a tenth, so being shown is partly credited as use: built, not in depth.
    source: https://github.com/mlapeter/counterparts/blob/547b6826e381a52b96a429898387696dabc6aa4e/CHANGELOG.md#0327--2026-10-19

  association:
    status: built
    depth: 3
    note: >-
      Memories used together get linked, as do ones written one after another; dreams link ones
      that belong together. Recall follows weighted links up to two steps, and a memory only a
      link reaches can come up: on the maker's own store, 16 did from 20 to 26 Oct.
    source: https://github.com/mlapeter/counterparts/blob/547b6826e381a52b96a429898387696dabc6aa4e/src/core/associate/spread.ts

  prospective:
    status: built
    depth: 3
    note: >-
      A memory can carry a date, once or repeating, and comes back around that day unasked,
      quietly or said plainly if marked to be. Claude sets the date; nothing reads it from the
      text.
    source: https://github.com/mlapeter/counterparts/blob/547b6826e381a52b96a429898387696dabc6aa4e/src/core/prospective/CONTRACT.md

  consolidation:
    status: built
    depth: 4
    note: >-
      Memories that held up get stronger and the steadiest become core. A dream once a day (on
      for new installs) merges near-copies, links, replays, folds an event's parts into one and
      writes patterns; every change is recorded and a whole dream can be undone.
    source: >-
      https://github.com/mlapeter/counterparts/blob/547b6826e381a52b96a429898387696dabc6aa4e/src/core/dream/CONTRACT.md

  reconsolidation:
    status: built
    depth: 3
    note: >-
      A contradiction is settled as changed, corrected or left open, each recorded and undoable,
      and the old memory is kept. A core memory needs a change declared on about three separate
      days (a finished plan leaves at once).
    source: >-
      https://github.com/mlapeter/counterparts/blob/547b6826e381a52b96a429898387696dabc6aa4e/src/core/revision.ts

  episodic-semantic:
    status: partial
    depth: 2
    note: >-
      A daily dream can write a pattern it sees across memories, labelled “Dreamed”, which
      starts weak and rises only as it's used later. It can also fold one event's parts into one
      memory. Nothing reliably turns many sessions into one lesson.
    dev:
      to: built
      note: >-
        Coming: what many sessions taught kept as knowledge of its own, while their details fade.
    source: https://github.com/mlapeter/counterparts/blob/547b6826e381a52b96a429898387696dabc6aa4e/src/core/dream/CONTRACT.md

  schema:
    status: partial
    depth: 2
    note: >-
      A person or project its memories keep naming gets a card, linked to every memory that
      names it. The nightly reflection forms beliefs about them, which start weak and grow only
      as memories back them, and the strongest come up when a message names their subject. On
      the maker's store there are 3 so far, none about a project, and none yet weighed against
      a new fact.
    dev:
      to: built
      note: >-
        Coming: beliefs about people and projects that change only when the evidence adds up.
    source: >-
      https://github.com/mlapeter/counterparts/blob/547b6826e381a52b96a429898387696dabc6aa4e/CHANGELOG.md#0331--2026-10-22

flow:
  steps:
    - label: You talk
      detail: A normal Claude Code session.
    - label: Things come to mind
      detail: Your words cue a few related memories, quietly.
    - label: It writes
      detail: At the end, Claude writes what it learned, with an importance score.
    - label: It sleeps
      detail: Used memories strengthen, unused ones fade, the steadiest become core.
    - label: It dreams
      detail: "Once a day: merges near-copies, links memories, then reflects."
    - label: It wakes
      detail: Next session opens with a note it wrote itself.
  loop:
    to: 0
    label: next session

checked: 2026-10-26
confirmed:
  by: mlapeter
  on: 2026-09-29
