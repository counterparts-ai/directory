# claude-mem, as counterparts.ai/directory/claude-mem/ shows it.

# Researched 2026-09-29 against claude-mem v13.28.0 (26 Sep 2026); checked
# again 2026-10-20 against v14.0.1 (17 Oct 2026): its repo, docs, source and
# release notes. What changed in 2026: v13.0.0 (8 May) relicensed it from
# AGPL-3.0 to Apache-2.0 and added an opt-in server runtime (Postgres). Since
# the summer, a paid hosted "CMEM Pro" can run the note-taking AI and sync
# memory across devices, and the interactive installer asks you to sign in and
# pre-selects it (a 30-day free trial since v13.34.1, 6 Oct; before that up to
# 14 days). cmem.ai now lists Pro at $30/mo, with Heavy ($70) and Max ($100)
# for more usage. Since the last check: v13.29.0 (3 Oct) added opt-in merging
# of notes with the same title and an opt-in ranking that lifts notes
# re-confirmed on later days; v13.32.0 (6 Oct) turned the File Read Gate back
# on by default, and v13.33.0 (6 Oct) narrowed it to code files of 32 KB and
# up: in the Claude Code main session, for a file inside the project that
# hasn't changed since its newest note, with tree-sitter installed, a full read
# is blocked and the file's notes and outline offered instead (smaller files
# just get their notes added); v13.35.0 (9 Oct) added a save_memory tool;
# v14.0.0 (17 Oct) added "My Work", a local view of requests and their
# status, and TeamBrain for teams (its release note says $50 per seat; cmem.ai
# says team pricing isn't announced). None of that is graded here except the
# merging (interference). Checked 2026-10-31 against v15.7.0 (30 Oct) for one
# thing: since v15.2.0 (25 Oct, #5031) the interactive installer's browser
# setup uploads your last 30 days of prompts to cmem.ai without asking (issue
# #5176, open; a consent fix, PR #5220, open and unmerged). Its code skips that
# page for --provider, --no-auto-start, the server runtime and non-TTY runs
# (src/npx-cli/install/browser-setup.ts); the plugin-marketplace install never
# opens it. Nothing marks a pre-15.2 install's setup done, so re-running the
# interactive installer there opens it too. Checked 2026-11-25 against v15.8.3's
# release notes and PR #5220 (merged 2 Nov), and docs/public/usage/my-work.mdx on
# main (v16.1.5), for the same thing: since v15.8.3 the setup page reads local
# history, then asks before uploading (per tool, all ticked to start; declining
# uploads nothing; button labels differ between 15.8.3, main's code and its docs);
# prompts uploaded by earlier versions are not removed. #5176 closed 10 Nov; the
# maker: earlier uploads are "for cmem.ai". On main, if a local pass with your own
# AI finishes, setup may not ask at all (setup-scan.ts).
# Checked 2026-11-26 against v17.0.0 (26 Nov 2026), its release notes since
# v16.1.5, cmem.ai/pricing, and its docs and code at that tag. Since v16.1.0
# (23 Nov) Cloud Sync is sold on its own: $12/mo after a 30-day trial (16.1.0
# and 16.1.1 needed a card for it; none since 16.1.4, 25 Nov), or $99/yr. The
# setup page now pre-selects that trial (initialFlowState in
# src/ui/my-work/src/setup/setup-flow.ts), with "This computer, free" beside it,
# and keeps your current note-taking provider (your Claude plan on a fresh
# install). Hosted note-taking ("hosted tokens": Pro $30, Heavy $70, Max $100 a
# month) is a separate purchase; cmem.ai/pricing says it's paid from day one with
# no trial, while docs/public/installation.mdx still mentions a 30-day trial for
# CMEM Pro. Existing bundled Pro plans keep both. v16.2.0 (26 Nov) added read-only
# notes on iMessage chats (a Photon line, or a Mac app that reads Messages with
# Full Disk Access); v17.0.0 added Review Stack to My Work. Graded now: My Rules
# (in My Work since v15), where a background refresh, on by default
# (CLAUDE_MEM_WORK_VIEW_AUTO_REFRESH), merges the working preferences your prompts
# show into suggested rules you approve (episodic-semantic, schema). Not graded:
# TeamBrain, and auto-update (on by default, installs releases the maker promotes).

slug: claude-mem
name: claude-mem
tagline: >-
  A Claude Code plugin that quietly takes notes on your coding sessions and hands them back next
  time.
category: work
maker: Alex Newman (thedotmack)
links:
  website: https://cmem.ai
  repos:
    - thedotmack/claude-mem
  packages:
    - registry: npm
      name: claude-mem
# everything memory-related is Apache-2.0; the hosted observer and sync are a paid service on top
openness: open

summary: >-
  While you work in Claude Code, a second, hidden AI watches each step (every file read, edit
  and command) and writes short notes about what was built, fixed or learned. After each reply
  it also writes a summary: what you asked, what was found, what's next. When you start again,
  the newest notes are laid out at the top of the chat, and Claude can search the rest by
  keywords or meaning, then open just the notes it needs.
forWho: >-
  Developers using Claude Code and other coding agents who want the next session to pick up
  where the last one left off, without writing notes themselves. It installs with one command;
  Cloud Sync, a paid add-on, carries memory across machines.
remembers: >-
  What happened while coding: bugs fixed, features built, decisions and discoveries, the files
  each one touched, your prompts, and a summary of each exchange. It also suggests rules for how
  you like agents to work, and since v16.2.0 it can take notes on iMessage chats you pick.
doesnt:
  - >-
    Notes are written once and kept as they are. Nothing fades or corrects them, so an outdated
    note sits beside the newer one. Repeats are merged only if you switch that on.
  - >-
    It remembers the work and how you like it done, not who you are: its rules cover working
    preferences only, and the AI has no sense of self.
  - >-
    The hidden note-taker is an extra AI working alongside every session. It runs on your Claude
    plan unless you choose another provider (Codex, Gemini, OpenRouter) or buy their hosted
    note-taking (from $30/mo); if the hosted service stops serving your account, it falls back to
    your Claude plan. The setup page pre-selects their Cloud Sync trial (30 days, no card; then
    $12/mo if you add one); "This computer, free" is the other choice.
  - >-
    Anonymous usage stats are on by default (the npx installer asks once, but not in CI or other
    non-interactive installs; one command turns them off). Apart from the setup upload below, a
    local install contacts cmem.ai once, to create its sign-in link, with a numbers-only usage
    summary. Cloud sync, if you turn it on, uploads your notes and prompts.
  - >-
    An interactive `npx claude-mem install`, including on an existing install, opens a setup
    page that can offer to upload the prompts you typed in the last 30 days to cmem.ai. That covers
    Claude Code and other coding agents on the machine, with project names and folder paths, and
    a hosted AI turns them into goals and rules. From v15.2.0 (25 Oct 2026) to v15.8.2 the page
    uploaded them as soon as it loaded, without asking. Since v15.8.3 (2 Nov) it asks first
    and lists each tool with its prompt count, all ticked; it uploads only the tools left
    ticked, and declining uploads nothing. Prompts uploaded by earlier versions stay uploaded. Installing with
    any `--provider`, with `--no-auto-start`, from a non-interactive shell, or from the Claude
    Code plugin marketplace skips that page.
standout:
  - >-
    Fully automatic: there's nothing to remember to save. A silent observer turns raw tool
    activity into tidy, labelled notes as you work.
  - >-
    Shows a cheap index first and fetches full detail only when needed, so memory doesn't eat up
    the conversation.
  - >-
    Notes tied to files: when Claude opens a file it has worked on before, that file's history
    comes up with it.
  - >-
    Widely used: about 120,000 GitHub stars (26 Nov 2026), with notes in about 30 languages and
    plugins for many coding agents.

facts:
  lives: Your machine (cloud sync optional)
  local: true
  keys: None on your Claude plan; or Codex, a Gemini or OpenRouter key, or their hosted tokens
  worksWith:
    - Claude Code
    - Codex
    - Cursor
    - OpenCode
    - OpenClaw
    - MCP tools
  license: Apache-2.0
  price: Free; Cloud Sync $12/mo or $99/yr; hosted note-taking from $30/mo
  tags:
    runs:
      - local
      - cloud
    needs:
      - none
      - model-key
      - their-key
    works:
      - Claude Code
      - Codex
      - Cursor
      - OpenCode
      - OpenClaw
      - MCP

hood:
  writes: >-
    A separate “observer” AI (Claude Haiku by default) watches each tool step and writes notes,
    plus a summary after each reply. The AI you talk to doesn't write them.
  stores: >-
    A SQLite database on your machine, with a local Chroma index for meaning-based search.
    Optional sync to their cloud. The interactive installer's setup page can also upload your
    last 30 days of prompts there: since v15.8.3 only if you say yes (v15.2.0 to v15.8.2 didn't
    ask).
  finds: >-
    The newest 50 notes and recent summaries are shown at the start. After that, Claude searches
    by keywords or meaning, looks at what happened around a note, and opens the ones it needs.
  cost: >-
    Yes: observer calls as you work, plus a summary each reply, and a background refresh of My
    Work that reviews your requests. They run on your Claude plan, another provider, or their paid
    hosted note-taking. The interactive
    installer's setup page can also upload your last 30 days of prompts to their cloud for a
    hosted AI to turn into goals and rules (since v15.8.3, only if you say yes).

mechanisms:
  salience:
    status: partial
    depth: 2
    note: >-
      The observer is told what's worth recording and to skip routine steps, and it labels each
      note (bugfix, decision…). There's no importance score.
    source: https://github.com/thedotmack/claude-mem/blob/main/plugin/modes/code.json

  emotional:
    status: none
    note: No emotional weighting. Notes are sorted by the kind of work, not by feeling.

  decay:
    status: partial
    depth: 1
    note: >-
      Nothing fades note by note, but meaning-based search only looks back 90 days by default,
      and the start of a session shows just the newest notes.
    source: >-
      https://github.com/thedotmack/claude-mem/blob/main/src/services/worker/search/strategies/ChromaSearchStrategy.ts

  interference:
    status: partial
    depth: 1
    note: >-
      If you switch it on, a new note whose title matches an older one is folded into it, and
      near matches are listed for you to review. It's off by default, and a newer note that
      contradicts an older one is simply stored beside it.
    source: https://docs.claude-mem.ai/configuration#near-duplicate-deduplication

  retrieval:
    status: none
    note: >-
      Being found doesn't strengthen a note. A usage counter exists in the database, but nothing
      updates it yet. With the opt-in merging on, a note the observer writes again on a later day
      is marked as re-confirmed, and another opt-in setting lets those climb into the start of a
      session.
    source: >-
      https://github.com/thedotmack/claude-mem/blob/b80b29bc49d08a71312f44b8feacb2e7585edff4/plans/21-sqlite-schema-evolution-and-queue-state.md
    dev:
      to: partial
      note: >-
        Their open fix plan (issue #3609) says the counter will go up each time a note is
        recalled.

  association:
    status: partial
    depth: 2
    note: >-
      Notes are tied to their files and their moment in a session, and a timeline tool brings up
      what happened just before and after one. Notes aren't linked to each other.
    source: https://github.com/thedotmack/claude-mem/blob/main/src/servers/mcp-server.ts

  prospective:
    status: partial
    depth: 2
    note: >-
      When Claude opens a file it has notes on, that file's history is added on its own. A full
      read of a code file of 32 KB or more is, by default, replaced by its notes and outline.
      There are no reminders for a set time.
    source: https://github.com/thedotmack/claude-mem/blob/main/src/cli/handlers/file-context.ts

  consolidation:
    status: none
    note: >-
      Nothing reworks notes between sessions. A summary is written after each reply, and a
      background refresh writes reviews of your requests, but old notes stay as first written.

  reconsolidation:
    status: none
    note: Nothing corrects an old note when it's contradicted; old and new sit side by side.

  episodic-semantic:
    status: partial
    depth: 2
    note: >-
      A background refresh, on by default, merges the working preferences your requests show into
      rules for how you like agents to work, with your quotes and how often each came up; you
      approve them. No lasting lessons about the code or project are drawn from the notes.
    source: >-
      https://github.com/thedotmack/claude-mem/blob/v17.0.0/plugin/skills/request-progress/SKILL.md

  schema:
    status: partial
    depth: 1
    note: >-
      My Rules keeps a list of how you like agents to work, and approved rules reach agents
      through MY-RULES.md. It covers working preferences only: there's no kept picture of who you
      are.
    source: >-
      https://github.com/thedotmack/claude-mem/blob/v17.0.0/src/services/work-view/my-rules.mjs

flow:
  steps:
    - label: You work
      detail: Claude reads, edits and runs commands as usual.
    - label: A hidden observer
      detail: Another AI watches each step and writes short, labelled notes.
    - label: Sum it up
      detail: "After each reply: what was asked, learned, done, and what's next."
    - label: Store
      detail: Saved in SQLite on your machine, searchable by keywords and meaning.
    - label: Hand them back
      detail: Next session, the newest notes come first; Claude searches for more.
  loop:
    to: 0
    label: next session

