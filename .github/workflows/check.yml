name: Check

on:
  pull_request:
  push:
    branches: [main]
  # The intake starts it on a branch it opened, since a pull request opened with a
  # workflow's token starts no workflows of its own.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # On a pull request the checker comes from main, not from the pull request,
      # so a change can't rewrite the check it has to pass.
      TOOLS: ${{ github.event_name != 'push' && 'base' || 'pr' }}
      BASE: ${{ github.event_name != 'push' && '--base base' || '' }}
      MAINTAINER: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && '--maintainer' || '' }}
    steps:
      - name: The files to check
        uses: actions/checkout@v4
        with:
          path: pr
      - name: What they change (main)
        if: github.event_name != 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix "$TOOLS"
      - name: Every file is complete and well-formed
        run: node "$TOOLS/scripts/check.mjs" --data pr $BASE $MAINTAINER
      - name: The links load
        run: node "$TOOLS/scripts/check.mjs" --data pr $BASE $MAINTAINER --links
        env:
          GITHUB_TOKEN: ${{ github.token }}
