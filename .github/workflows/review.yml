name: Review

# Reviews a contributor's pull request against its sources, and merges it when every
# grade holds. MAINTAINING.md says what it checks and when it leaves a pull request
# for a maintainer.
#
# It runs on pull_request_target so it can use the Claude token on pull requests from
# forks. That means it runs with this repo's trust: the scripts come from main, and the
# pull request's files are only ever read, never installed or run. The job that reads
# the pull request can't merge anything; a second job, which never reads it, merges.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      dry_run:
        description: Write the review to this run's summary instead of commenting or merging
        type: boolean
        default: true

env:
  # "false" posts the review but never merges.
  AUTO_MERGE: "true"
  # The spending limits: at most this many reviews a day, and on one pull request, each run
  # stopped at this many dollars (a review has cost $0.13-0.32).
  MAX_REVIEWS_PER_DAY: 20
  MAX_REVIEWS_PER_PR: 6
  MAX_USD_PER_REVIEW: 1.5
  # How many times the intake may revise a page it opened, from a review's notes, before
  # a maintainer takes over.
  MAX_REVISIONS: 2
  MODEL: claude-sonnet-5-5
  CLAUDE_CODE_VERSION: 2.1.296
  MAINTAINER: mlapeter

permissions: {}

concurrency:
  group: review-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # A maintainer's own pull requests are reviewed by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # to count today's runs
      contents: read
      pull-requests: write # to comment
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    outputs:
      merge: ${{ steps.decide.outputs.merge }}
      revise: ${{ steps.decide.outputs.revise }}
      issue: ${{ steps.pr.outputs.issue }}
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
      dry_run: ${{ steps.pr.outputs.dry_run }}
    steps:
      - name: The pull request
        id: pr
        env:
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" > pr.json
          if [ "$(jq -r .base.ref pr.json)" != "main" ]; then echo "Not a pull request into main."; exit 1; fi
          SHA=$(jq -r .head.sha pr.json)
          BASE_SHA=$(jq -r .base.sha pr.json)
          {
            echo "number=$NUMBER"
            echo "repo=$(jq -r .head.repo.full_name pr.json)"
            echo "sha=$SHA"
            echo "author=$(jq -r .user.login pr.json)"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          # A page the intake opened: the bot's own branch here, for the issue it closes.
          # Nobody else pushes to it, so the intake revises it from the review's notes.
          ISSUE=$(jq -r '.body // ""' pr.json | grep -oE '^Closes #[0-9]+$' | tail -1 | tr -dc 0-9 || true)
          if [ "$(jq -r .user.login pr.json)" = "github-actions[bot]" ] && [ "$(jq -r .head.repo.full_name pr.json)" = "$GITHUB_REPOSITORY" ] &&
             [[ "$(jq -r .head.ref pr.json)" == add-* ]] && [ -n "$ISSUE" ]; then
            echo "intake=--intake" >> "$GITHUB_OUTPUT"
            echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
            # The first commit is the draft; each revision adds one.
            if [ "$(jq -r .commits pr.json)" -le "$MAX_REVISIONS" ]; then echo "revise=--revise" >> "$GITHUB_OUTPUT"; fi
          fi
          # What this exact commit changes, against where it branched from main.
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$SHA" --jq '.files[] | "\(.status) \(.filename)"' > changed.txt
          cat changed.txt

      - name: Main's scripts and files (as main is now)
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
          persist-credentials: false

      - name: The pull request's files (read, never run)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}
          path: pr
          persist-credentials: false
          # checkout refuses a fork's code under pull_request_target unless told; here it
          # is only read (no install, no scripts, no credentials kept), so it's allowed.
          allow-unsafe-pr-checkout: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix base

      - name: Decide whether it can merge on its own, and fetch its sources
        id: prep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          node base/scripts/review-prep.mjs --data pr --base base --changed changed.txt --author "$AUTHOR" --out base/review
          if [ "$(jq -r .eligible base/review/gate.json)" = "true" ]; then
            node base/scripts/budget.mjs --workflow review.yml --max "$MAX_REVIEWS_PER_DAY" --noun "automatic reviews" \
              --pr "$NUMBER" --pr-max "$MAX_REVIEWS_PER_PR" --gate base/review/gate.json || true
          fi
          echo "eligible=$(jq -r .eligible base/review/gate.json)" >> "$GITHUB_OUTPUT"

      # Installed in its own step, so no install script runs where the token is.
      - name: Install Claude Code
        if: steps.prep.outputs.eligible == 'true'
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      # No network and no shell: the reviewer reads files and returns a verdict, nothing more.
      - name: Review the grades against the sources
        if: steps.prep.outputs.eligible == 'true'
        working-directory: base
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ""
          # Reading stays in this folder: the token lives in the process environment.
          PRIVATE: >-
            Read(//proc/**),Read(//sys/**),Read(//dev/**),Read(//etc/**),Read(//root/**),
            Read(//tmp/**),Read(//run/**),Read(//var/**),Read(//opt/**),Read(//usr/**),
            Read(//home/runner/work/_temp/**),Read(//home/runner/.*/**),Read(//home/runner/runners/**),
            Read(//home/runner/actions-runner/**),Read(//home/runner/work/*/*/pr/**)
        run: |
          claude -p "$(cat scripts/review-prompt.md)" \
            --model "$MODEL" \
            --allowedTools "Read,Glob,Grep" \
            --disallowedTools "Bash,Write,Edit,NotebookEdit,Task,WebFetch,WebSearch,${PRIVATE// /}" \
            --max-turns 40 \
            --max-budget-usd "$MAX_USD_PER_REVIEW" \
            --output-format json \
            --json-schema "$(cat scripts/review-verdict.schema.json)" \
            > review/claude.json || true
          jq '{subtype, num_turns, total_cost_usd, is_error}' review/claude.json || true

      - name: Write the comment and decide
        id: decide
        env:
          REDACT_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REDACT_2: ${{ secrets.SITE_DEPLOY_HOOK }}
          REDACT_3: ${{ github.token }}
          INTAKE: ${{ steps.pr.outputs.intake }}
          REVISE: ${{ steps.pr.outputs.revise }}
        run: node base/scripts/review-decide.mjs --out base/review --maintainer "$MAINTAINER" $INTAKE $REVISE >> "$GITHUB_OUTPUT"

      - name: Post the review
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            cat base/review/comment.md >> "$GITHUB_STEP_SUMMARY"
            echo "Dry run: the review is in this run's summary, and here:"
            cat base/review/comment.md
          else
            gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file base/review/comment.md
          fi

  merge:
    needs: review
    if: needs.review.outputs.merge == 'true' && needs.review.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      checks: read # for gh pr checks
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ needs.review.outputs.number }}
      SHA: ${{ needs.review.outputs.sha }}
    steps:
      - name: Merge once the check passes
        id: merge
        if: env.AUTO_MERGE == 'true'
        run: |
          # The check runs separately; wait for it. `check` must be a required status on main.
          sleep 20
          timeout 15m gh pr checks "$NUMBER" --repo "$GITHUB_REPOSITORY" --required --watch --fail-fast
          # Only the commit that was reviewed.
          gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$SHA"

      # A merge made with this workflow's token doesn't start other workflows,
      # so the rebuild that deploy.yml would ask for is asked for here.
      - name: Rebuild the site
        if: steps.merge.outcome == 'success'
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" > /dev/null && echo "Rebuild requested." || echo "::warning::The rebuild request failed."; fi

      - name: Say so if the merge didn't happen
        if: failure() && steps.merge.outcome == 'failure'
        run: |
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "The grades hold, but the merge didn't go through (the check failed, took too long, or the branch changed). @$MAINTAINER"

  # A page the intake opened goes back to it when the review asks only for wording or a
  # lower grade. The intake drafts it again from the review's notes, pushes the change and
  # starts the check and the review on it (pushes made with a workflow's token start none).
  revise:
    needs: review
    if: needs.review.outputs.revise == 'true' && needs.review.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # to start the intake
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ needs.review.outputs.number }}
      ISSUE: ${{ needs.review.outputs.issue }}
    steps:
      - run: gh workflow run intake.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue="$ISSUE" -f pr="$NUMBER" -f dry_run=false -f review=true
